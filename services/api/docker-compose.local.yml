services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitforge
      POSTGRES_PASSWORD: fitforge
      POSTGRES_DB: fitforge_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.example
    ports:
      - "3000:3000"

volumes:
  postgres_data:
