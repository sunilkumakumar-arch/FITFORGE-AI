name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run api:prisma:validate
      - run: npm run api:build
      - run: npm run api:test
      - run: npm run web:build
      - run: npm run web:typecheck
