      - in: query
        name: payment_date
        schema:
          type: string
          format: date
      - in: query
        name: payment_method
        schema:
          type: string
          enum:
          - BANK_TRANSFER
          - CASH
          - CHEQUE
          - CREDIT_CARD
          - DEBIT_CARD
          - NET_BANKING
          - UPI
          - WALLET
        description: |-
          * `CASH` - Cash
          * `UPI` - UPI
          * `CREDIT_CARD` - Credit Card
          * `DEBIT_CARD` - Debit Card
          * `NET_BANKING` - Net Banking
          * `BANK_TRANSFER` - Bank Transfer
          * `CHEQUE` - Cheque
          * `WALLET` - Wallet
      - in: query
        name: payment_status
        schema:
          type: string
          enum:
          - CANCELLED
          - COMPLETED
          - FAILED
          - PARTIAL
          - PENDING
          - REFUNDED
        description: |-
          * `PENDING` - Pending
          * `COMPLETED` - Completed
          * `PARTIAL` - Partial
          * `FAILED` - Failed
          * `REFUNDED` - Refunded
          * `CANCELLED` - Cancelled
      - name: search
        required: false
        in: query
        description: A search term.
